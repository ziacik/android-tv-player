name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify release deploy script
        run: |
          test -x deploy.sh
          sh -n deploy.sh
          grep -q './gradlew assembleRelease' deploy.sh
          grep -q 'zipalign' deploy.sh
          grep -q 'apksigner.*sign' deploy.sh
          grep -q 'assets/channels.json' deploy.sh
          grep -q 'adb -s.*install -r' deploy.sh
      - name: Verify debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify signed release build
        env:
          KANALIK_KEYSTORE_FILE: ${{ runner.temp }}/kanalik-ci-release.jks
          KANALIK_KEYSTORE_PASSWORD: android
          KANALIK_KEY_ALIAS: kanalik-ci
          KANALIK_KEY_PASSWORD: android
          KANALIK_VERSION_NAME: 0.1.0-ci
          KANALIK_VERSION_CODE: '1'
        run: |
          keytool -genkeypair \
            -keystore "$KANALIK_KEYSTORE_FILE" \
            -storepass "$KANALIK_KEYSTORE_PASSWORD" \
            -alias "$KANALIK_KEY_ALIAS" \
            -keypass "$KANALIK_KEY_PASSWORD" \
            -dname 'CN=Kanálik CI,O=Kanálik,C=SK' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1
          ./gradlew assembleRelease --stacktrace
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          if unzip -l "$apk" | grep -q 'assets/channels.json'; then
            echo 'Release APK unexpectedly contains assets/channels.json' >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
      - name: Upload verification reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
