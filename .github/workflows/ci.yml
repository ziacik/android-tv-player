name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify release deploy script
        run: |
          test -x deploy.sh
          sh -n deploy.sh
          grep -q './gradlew assembleRelease' deploy.sh
          grep -q 'zipalign' deploy.sh
          grep -q 'apksigner.*sign' deploy.sh
          grep -q 'assets/channels.json' deploy.sh
          grep -q 'adb -s.*install -r' deploy.sh
      - name: Verify default channel catalog URL
        run: |
          grep -q 'const val CHANNELS_URL = "https://plainraw.com/json/cbc833011422"' app/src/main/java/sk/ziacik/androidtvplayer/MainActivity.kt
          grep -q 'const val CHANNELS_URL = "https://plainraw.com/json/cbc833011422"' app/src/main/java/sk/ziacik/androidtvplayer/systemepg/KanalikCatalog.kt
          ! grep -R -q 'raw.githubusercontent.com/ziacik/android-tv-player/master/channels.json' app/src/main/java
      - name: Verify
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Upload verification reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 7
