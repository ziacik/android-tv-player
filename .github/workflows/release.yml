name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Read version from source
        id: version
        shell: bash
        run: |
          version_name="$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)"\s*$/\1/p' app/build.gradle.kts | head -n1)"
          version_code="$(sed -nE 's/^\s*versionCode\s*=\s*([0-9]+)\s*$/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kanalik-release.jks"

      - name: Verify
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build signed release APK
        env:
          KANALIK_KEYSTORE_FILE: ${{ runner.temp }}/kanalik-release.jks
          KANALIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KANALIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KANALIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          if unzip -l "$apk" | grep -q 'assets/channels.json'; then
            echo 'Release APK unexpectedly contains assets/channels.json' >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          cp "$apk" "kanalik-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kanalik-${{ steps.version.outputs.name }}
          path: kanalik-${{ steps.version.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          tag="v${VERSION_NAME}"
          apk="kanalik-${VERSION_NAME}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --generate-notes --title "Kanálik ${VERSION_NAME}"
          fi
