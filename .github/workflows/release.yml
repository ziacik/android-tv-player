name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, e.g. 0.1.0
        required: true
        default: '0.1.0'
      version_code:
        description: Monotonically increasing Android version code
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kanalik-release.jks"

      - name: Verify
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build signed release APK
        env:
          KANALIK_KEYSTORE_FILE: ${{ runner.temp }}/kanalik-release.jks
          KANALIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KANALIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KANALIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KANALIK_VERSION_NAME: ${{ inputs.version_name }}
          KANALIK_VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          if unzip -l "$apk" | grep -q 'assets/channels.json'; then
            echo 'Release APK unexpectedly contains assets/channels.json' >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          cp "$apk" "kanalik-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kanalik-${{ inputs.version_name }}
          path: kanalik-${{ inputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          tag="v${VERSION_NAME}"
          apk="kanalik-${VERSION_NAME}.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --generate-notes --title "Kanálik ${VERSION_NAME}"
          fi
