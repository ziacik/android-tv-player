name: Probe STVR JSON API

on:
  push:
    branches:
      - fix/stvr-archive-program-page

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect STVR archive frontend
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          import urllib.parse

          page_url = "https://www.stvr.sk/televizia/archiv?date=2026-09-21&ord=dt"
          html = urllib.request.urlopen(page_url, timeout=30).read().decode("utf-8", "replace")
          print("=== endpoint in html ===")
          for m in re.finditer(r"json/tv/archiv", html):
              print(html[max(0, m.start()-300):m.end()+500])

          scripts = re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)', html, re.I)
          print("=== scripts ===")
          for src in scripts:
              print(src)

          for src in scripts:
              url = urllib.parse.urljoin(page_url, src)
              try:
                  body = urllib.request.urlopen(url, timeout=30).read().decode("utf-8", "replace")
              except Exception as exc:
                  print("SKIP", url, exc)
                  continue
              needle = "json/tv/archiv"
              pos = body.find(needle)
              if pos >= 0:
                  print("=== FOUND", url, "===")
                  print(body[max(0, pos-1200):pos+2200])
          PY
