name: Probe STVR JSON API

on:
  push:
    branches:
      - fix/stvr-archive-program-page

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect STVR archive frontend
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import urllib.request

          page_url = "https://www.stvr.sk/televizia/archiv?date=2026-09-21&ord=dt"
          html = urllib.request.urlopen(page_url, timeout=30).read().decode("utf-8", "replace")

          print("=== results element ===")
          m = re.search(r'<[^>]+id=["\\\']tv-archiv-results["\\\'][^>]*>', html, re.I)
          print(m.group(0) if m else "NOT FOUND")

          print("=== chunk params attrs ===")
          for m in re.finditer(r'data-(?:chunk-base-params|archive-node)=["\\\']([^"\\\']*)', html, re.I):
              print(m.group(0))

          js_url = "https://www.stvr.sk/media/new/js/complete.min.js?1789742763"
          js = urllib.request.urlopen(js_url, timeout=30).read().decode("utf-8", "replace")
          needle = "/json/tv/archiv"
          print("=== all endpoint contexts ===")
          start = 0
          index = 0
          while True:
              pos = js.find(needle, start)
              if pos < 0:
                  break
              index += 1
              print("---", index, "---")
              print(js[max(0, pos-1800):pos+3600])
              start = pos + len(needle)
          PY
