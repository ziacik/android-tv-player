name: Probe STVR JSON API

on:
  push:
    branches:
      - fix/stvr-archive-program-page

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare archive API params
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.stvr.sk/json/tv/archiv?archive=1&d=2026-09-21&p=1&l=100&o=desc'
          for suffix in 'e=1' 'e=2' 'e=3' 'e=15' ''; do
            label="${suffix:-no-e}"
            url="$base"
            [ -z "$suffix" ] || url="$url&$suffix"
            curl --fail --silent --show-error --location "$url" -o "/tmp/${label//=/}.json"
            echo "=== $label ==="
            jq -c '{paging, items: [.program[] | {ID,series,name,air}]}' "/tmp/${label//=/}.json" | sha256sum
            jq -c '.paging' "/tmp/${label//=/}.json"
            jq -c '.program[] | select(.name=="Duel" or (.name|contains("Profesion"))) | {ID,series,name,air}' "/tmp/${label//=/}.json"
          done
