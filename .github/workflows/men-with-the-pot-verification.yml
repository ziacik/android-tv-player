name: Men With The Pot verification

on:
  push:
    branches:
      - feat/men-with-the-pot
      - fix/prefer-hd-adaptive-streams
      - feat/modern-osd-timeline-clock
      - fix/background-playback-lifecycle

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
