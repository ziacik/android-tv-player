name: Stream host verification

on:
  push:
    branches:
      - feature/stream-host-in-osd

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
