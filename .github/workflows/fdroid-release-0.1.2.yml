name: F-Droid release 0.1.2

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kanalik-release.jks"

      - name: Verify
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build signed release APK
        env:
          KANALIK_KEYSTORE_FILE: ${{ runner.temp }}/kanalik-release.jks
          KANALIK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KANALIK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KANALIK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KANALIK_VERSION_NAME: 0.1.2
          KANALIK_VERSION_CODE: 3
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK
        run: |
          apk='app/build/outputs/apk/release/app-release.apk'
          test -f "$apk"
          if unzip -l "$apk" | grep -q 'assets/channels.json'; then
            echo 'Release APK unexpectedly contains assets/channels.json' >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          cp "$apk" kanalik-0.1.2.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.2 kanalik-0.1.2.apk --target "$GITHUB_SHA" --generate-notes --title "Kanálik 0.1.2"
